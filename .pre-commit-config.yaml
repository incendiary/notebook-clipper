repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        exclude: ^lib/

  - repo: local
    hooks:
      - id: validate
        name: notebook-clipper structural validation
        entry: node test/validate.js
        language: system
        pass_filenames: false
